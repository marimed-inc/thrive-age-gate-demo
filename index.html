<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thrive | Age Gate Demo</title>

    <script src="https://unpkg.com/@jmeirinkmarimed/age-gate@1.0.38/dist/age-gate.min.js"></script>
  </head>
  <body>
    <main>
      <h1>Thrive Age Gate Demo</h1>
      <p>This is a demonstration of the Thrive age verification.</p>
    </main>

    <age-gate
      min-age="21"
      confirmation-type="yesNo"
      header-text="Are you 21 or older?"
      sub-header-text="Please confirm your age to continue."
    ></age-gate>
  </body>
</html>
